<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desafíos Caminando desde Devoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green:      #1a6b4a;
    --green-soft: #e8f5ee;
    --teal:       #2a9d8f;
    --gold:       #c07d28;
    --orange:     #c2560f;
    --bg:         #f5f2e8;
    --card:       #fffef9;
    --ink:        #1d1c1a;
    --muted:      #68645d;
    --border:     #e4dccd;
    --shadow:     0 4px 16px rgba(26,107,74,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: linear-gradient(180deg, #f9f7f0 0%, var(--bg) 50%, #ede8d8 100%);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 80px; }
  @media (min-width: 860px) { .wrap { max-width: 880px; } }

  /* HEADER */
  .hero { padding: 22px 0 22px; border-bottom: 1px solid var(--border); margin-bottom: 22px; }
  .eyebrow { color: var(--gold); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
  h1 { font-family: 'Fraunces', serif; font-size: clamp(28px, 6.5vw, 42px); font-weight: 700; color: var(--green); line-height: .98; margin-bottom: 6px; }
  .hero-sub { color: var(--muted); font-size: 13.5px; }

  /* PROGRESS STRIP */
  .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 22px; }
  .info-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 11px 10px; text-align: center; }
  .info-val { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 700; color: var(--green); line-height: 1; }
  .info-label { font-size: 9.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .progress-bar-outer { height: 8px; background: var(--green-soft); border-radius: 5px; overflow: hidden; margin-bottom: 22px; }
  .progress-bar-inner { height: 100%; background: var(--green); border-radius: 5px; transition: width .4s; }

  /* BADGES */
  .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
  .badge-pill {
    display: flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700;
    padding: 6px 11px; border-radius: 20px;
    border: 1.5px solid var(--border); background: white; color: var(--muted);
  }
  .badge-pill.earned { border-color: var(--gold); background: #fbf3e6; color: var(--gold); }

  /* FILTERS */
  .filters { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0; padding: 7px 13px; border: 1.5px solid var(--border); border-radius: 20px;
    background: white; color: var(--ink); font-size: 12px; font-weight: 700; cursor: pointer;
    white-space: nowrap; transition: all .15s;
  }
  .filter-btn.active { background: var(--green); border-color: var(--green); color: white; }

  /* CARDS */
  .cards { display: grid; gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow); border-top: 4px solid var(--border);
  }
  .card.done { border-top-color: var(--green); }
  .card.next { border-top-color: var(--orange); }
  .card-head { padding: 14px 16px 10px; }
  .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .cat-badge { font-size: 11px; font-weight: 800; color: var(--teal); text-transform: uppercase; letter-spacing: .06em; }
  .next-flag { font-size: 10.5px; font-weight: 800; color: var(--orange); background: #fdece0; padding: 3px 8px; border-radius: 10px; white-space: nowrap; }
  .card h3 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
  .card-addr { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; margin-bottom: 8px; }
  .card-dist { display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 3px 9px; border-radius: 8px; margin-bottom: 10px; }
  .card-fact { font-size: 13px; color: var(--ink); margin-bottom: 4px; }
  .card-source { font-size: 10.5px; color: var(--muted); font-style: italic; margin-bottom: 12px; }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 14px; }
  .btn {
    font-size: 12.5px; font-weight: 700; padding: 9px 14px; border-radius: 9px; border: 1.5px solid var(--border);
    background: white; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn.maps { border-color: var(--teal); color: var(--teal); }
  .btn.done-btn { border-color: var(--green); color: var(--green); }
  .btn.done-btn.active { background: var(--green); color: white; }
  .btn.undo-btn { border-color: var(--muted); color: var(--muted); font-size: 11px; padding: 6px 10px; }

  .done-summary { font-size: 12px; color: var(--green); font-weight: 700; padding: 0 16px 12px; }
  .done-summary .meta { color: var(--muted); font-weight: 500; }

  /* FORM */
  .complete-form { padding: 0 16px 16px; display: grid; gap: 8px; border-top: 1px dashed var(--border); margin-top: 4px; padding-top: 12px; }
  .complete-form label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .complete-form input, .complete-form textarea {
    width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 13px; background: white;
  }
  .complete-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }

  .empty { text-align: center; padding: 40px 10px; color: var(--muted); font-size: 13px; }
  .sync-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; }
</head>

  { id:'jardin-botanico-agronomia', name:'Facultad de Agronomía UBA · Jardín Botánico Lucien Hauman', cat:'parque', addr:'Av. San Martín 4453, Agronomía, CABA', km:7.8, stars:4,

  { id:'chacarita-gardel', name:'Cementerio de la Chacarita · Mausoleo de Carlos Gardel', cat:'monumento', addr:'Av. Guzmán 680, Chacarita, CABA', km:13.0, stars:5,
    fact:'El cementerio se creó a las apuradas en 1871 para hacer frente a una epidemia de fiebre amarilla; el predio actual de 97 hectáreas abrió en 1887. El mausoleo de Gardel, construido entre 1936 y 1937, está coronado por una estatua de tamaño real a la que los fans todavía le encienden un cigarrillo entre los dedos de bronce.', source:'fundacioncarlosgardel.org' },

  { id:'mercado-pulgas', name:'Mercado de las Pulgas', cat:'mercado', addr:'Av. Álvarez Thomas y Av. Dorrego, Chacarita, CABA', km:15.4, stars:4,

];
CHALLENGES.sort((a,b) => a.km - b.km);

let progress = {};

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) progress = JSON.parse(raw);
  } catch (e) { progress = {}; }
}
function saveLocal() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(progress)); } catch (e) {}
}

async function loadRemote() {
  try {
    const res = await fetch(SB_TABLE + '?select=*', { headers: SB_HDR });
    if (!res.ok) throw new Error('sync fail');
    const rows = await res.json();
    rows.forEach(r => { progress[r.id] = r; });
    saveLocal();
    document.getElementById('syncNote').textContent = '';
  } catch (e) {
    document.getElementById('syncNote').textContent = 'Sin conexión con el servidor — mostrando el último progreso guardado en este dispositivo.';
  }
}

async function saveRemote(id, data) {
  const payload = Object.assign({ id }, data, { updated_at: new Date().toISOString() });
  progress[id] = payload;
  saveLocal();
  render();
  try {
    await fetch(SB_TABLE + '?on_conflict=id', {
      method: 'POST',
      headers: Object.assign({}, SB_HDR, { 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify([payload])
    });
  } catch (e) {
    document.getElementById('syncNote').textContent = 'No se pudo sincronizar con el servidor — el progreso quedó guardado solo en este dispositivo.';
  }
}

let activeFilter = 'todas';

function renderFilters() {
  const cats = ['todas', ...Array.from(new Set(CHALLENGES.map(c => c.cat)))];
  const box = document.getElementById('filters');
  box.innerHTML = cats.map(c => {
    const label = c === 'todas' ? 'Todas' : CATS[c].icon + ' ' + CATS[c].label;
    return `<button class="filter-btn ${c===activeFilter?'active':''}" data-cat="${c}">${label}</button>`;
  }).join('');
  box.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => { activeFilter = btn.dataset.cat; render(); });
  });
}

function computeBadges(doneList, kmTotal, catCount) {
  const total = CHALLENGES.length;
  return [
    { id:'primeros', label:'👟 Primeros pasos', earned: doneList.length >= 1 },
    { id:'mitad', label:'🥾 Mitad de camino', earned: doneList.length >= Math.ceil(total/2) },
    { id:'todos', label:'🏅 Los 16 desafíos', earned: doneList.length >= total },
    { id:'explorador', label:'🧭 Explorador (5 categorías)', earned: catCount >= 5 },
    { id:'50km', label:'⭐ 50 km recorridos', earned: kmTotal >= 50 },
    { id:'100km', label:'⭐ 100 km recorridos', earned: kmTotal >= 100 }
  ];
}

function nextChallengeId() {
  const pending = CHALLENGES.filter(c => !(progress[c.id] && progress[c.id].completado));
  return pending.length ? pending[0].id : null;
}

function stars(n) { return '★'.repeat(n) + '☆'.repeat(5-n); }

function mapsUrl(addr) {
  return 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(ORIGIN) + '&destination=' + encodeURIComponent(addr) + '&travelmode=walking';
}

function cardHtml(c) {
  const p = progress[c.id];
  const done = !!(p && p.completado);
  const isNext = !done && c.id === nextChallengeId();
  const cat = CATS[c.cat];
  let statusBlock = '';
  if (done) {
    const kmShown = (p.km_reales != null && p.km_reales !== '') ? p.km_reales : c.km;
    statusBlock = `<div class="done-summary">✅ Completado${p.fecha_completado ? ' el ' + p.fecha_completado : ''} <span class="meta">· ${kmShown}km${p.nota ? ' · "' + escapeHtml(p.nota) + '"' : ''}</span></div>
      <div class="card-actions"><button class="btn undo-btn" data-action="undo" data-id="${c.id}">Deshacer</button></div>`;
  } else {
    statusBlock = `<div class="card-actions">
        <a class="btn maps" href="${mapsUrl(c.addr)}" target="_blank" rel="noopener">🗺️ Ver en Maps</a>
        <button class="btn done-btn" data-action="open-form" data-id="${c.id}">Marcar como completado</button>
      </div>
      <div class="complete-form" id="form-${c.id}" style="display:none">
        <div class="row2">
          <div><label>Fecha</label><input type="date" id="fecha-${c.id}" value="${todayStr()}"></div>
          <div><label>Km reales (opcional)</label><input type="number" step="0.1" min="0" id="km-${c.id}" placeholder="${c.km}"></div>
        </div>
        <div><label>Nota (opcional)</label><textarea id="nota-${c.id}" rows="2" placeholder="¿Cómo estuvo?"></textarea></div>
        <div class="form-actions">
          <button class="btn done-btn active" data-action="save" data-id="${c.id}">Guardar</button>
          <button class="btn undo-btn" data-action="close-form" data-id="${c.id}">Cancelar</button>
        </div>
      </div>`;
  }
  return `<div class="card ${done?'done':''} ${isNext?'next':''}" data-cat="${c.cat}">
    <div class="card-head">
      <div class="card-top-row">
        <span class="cat-badge">${cat.icon} ${cat.label}</span>
        ${isNext ? '<span class="next-flag">PRÓXIMO DESAFÍO</span>' : ''}
      </div>
      <h3>${c.name}</h3>
      <div class="card-addr">${c.addr}</div>
      <div class="stars">${stars(c.stars)}</div>
      <div class="card-dist">🚶 ${c.km} km ida y vuelta (aprox.)</div>
      <div class="card-fact">${c.fact}</div>
      <div class="card-source">Fuente: ${c.source}</div>
    </div>
    ${statusBlock}
  </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function render() {
  renderFilters();

  const doneList = CHALLENGES.filter(c => progress[c.id] && progress[c.id].completado);
  const kmTotal = doneList.reduce((sum, c) => {
    const p = progress[c.id];
    const km = (p.km_reales != null && p.km_reales !== '') ? Number(p.km_reales) : c.km;
    return sum + (isNaN(km) ? 0 : km);
  }, 0);
  const catCount = new Set(doneList.map(c => c.cat)).size;
  const totalCats = new Set(CHALLENGES.map(c => c.cat)).size;

  document.getElementById('statDone').textContent = doneList.length + '/' + CHALLENGES.length;
  document.getElementById('statKm').textContent = Math.round(kmTotal * 10) / 10;
  document.getElementById('statCat').textContent = catCount + '/' + totalCats;
  document.getElementById('progressBar').style.width = Math.round((doneList.length / CHALLENGES.length) * 100) + '%';

  const badges = computeBadges(doneList, kmTotal, catCount);
  document.getElementById('badges').innerHTML = badges.map(b =>
    `<span class="badge-pill ${b.earned?'earned':''}">${b.label}</span>`
  ).join('');

  const list = CHALLENGES.filter(c => activeFilter === 'todas' || c.cat === activeFilter);
  const cardsBox = document.getElementById('cards');
  cardsBox.innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">No hay desafíos en esta categoría.</div>';

  cardsBox.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onCardAction);
  });
}

function onCardAction(e) {
  const action = e.currentTarget.dataset.action;
  const id = e.currentTarget.dataset.id;
  if (action === 'open-form') {
    document.getElementById('form-' + id).style.display = 'grid';
  } else if (action === 'close-form') {
    document.getElementById('form-' + id).style.display = 'none';
  } else if (action === 'save') {
    const fecha = document.getElementById('fecha-' + id).value || todayStr();
    const kmVal = document.getElementById('km-' + id).value;
    const nota = document.getElementById('nota-' + id).value;
    saveRemote(id, {
      completado: true,
      fecha_completado: fecha,
      km_reales: kmVal ? Number(kmVal) : null,
      nota: nota || null
    });
  } else if (action === 'undo') {
    saveRemote(id, { completado: false, fecha_completado: null, km_reales: null, nota: null });
  }
}

(async function init() {
  loadLocal();
  render();
  await loadRemote();
  render();
})();
</script>
</body>
</html>
